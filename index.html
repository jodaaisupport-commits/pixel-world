<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pixel World – Prototyp</title>
  <link rel="icon" href="data:," />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #14100f; }
    canvas#game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    .panel {
      position: fixed; color: #f7eedc; background: rgba(32, 22, 26, 0.82);
      border: 3px solid #f7eedc; box-shadow: 0 0 0 3px #20161a, 4px 4px 0 3px rgba(0,0,0,0.35);
      font: bold 14px/1.35 ui-monospace, "DejaVu Sans Mono", "Courier New", monospace;
      padding: 6px 10px; letter-spacing: 0.5px; user-select: none; pointer-events: none;
    }
    #hud { top: 14px; left: 14px; }
    #hud-place { font-size: 17px; color: #ffe14d; }
    #hud-coords { color: #cfc2a8; font-size: 12px; }
    #help { bottom: 14px; left: 14px; font-size: 12px; color: #e8dcc2; }
    #help b { color: #ffe14d; }
    #minimap { top: 14px; right: 14px; padding: 4px; }
    #minimap canvas { display: block; width: 192px; height: 144px; image-rendering: pixelated; }
    #prompt { bottom: 70px; left: 50%; transform: translateX(-50%); font-size: 13px; }
    #dialog { bottom: 66px; left: 50%; transform: translateX(-50%); max-width: 640px; width: 70%; font-size: 15px; padding: 12px 16px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud" class="panel"><div id="hud-place">…</div><div id="hud-coords"></div></div>
  <div id="help" class="panel"><b>WASD/Pfeile</b> laufen · <b>Shift</b> rennen · <b>E</b> lesen · <b>M</b> Karte · <b>T</b> Tageszeit · <b>+/-</b> Zoom</div>
  <div id="minimap" class="panel hidden"><canvas id="minimap-canvas"></canvas></div>
  <div id="prompt" class="panel hidden"><b>E</b> – ansehen</div>
  <div id="dialog" class="panel hidden"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
